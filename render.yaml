services:
  - type: web
    name: desisports-v2
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js && npx tsx scripts/rerun-match-analyses.ts && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: LITELLM_API_BASE
        sync: false
      - key: LITELLM_API_KEY
        sync: false
      - key: VISION_MODEL
        value: gpt-4o-mini

