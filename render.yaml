services:
  - type: web
    name: desisports-v2
    env: node
    plan: starter
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: LITELLM_API_BASE
        sync: false
      - key: LITELLM_API_KEY
        sync: false
      - key: VISION_MODEL
        value: gpt-4o-mini
      - key: NEXT_PUBLIC_APP_URL
        value: https://desisports-v2.onrender.com
